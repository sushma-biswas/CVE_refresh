name: NVD gap collector

# Runs the collector daily, appends the change log, and commits it back.
#
# Two deliberate storage decisions:
#
#   * The change log and rollups ARE committed to the repository. They are
#     small, append-only, and cannot be rebuilt from any upstream source. A
#     git history also makes them tamper-evident, which matters for a project
#     whose whole value is that its numbers can be trusted and cited.
#
#   * state/current.parquet is NOT committed. It is tens of megabytes and
#     changes every day, so committing it would bloat history for no gain -
#     it is fully rebuildable from a crawl. It lives in the Actions cache,
#     which a daily job keeps warm, and the job re-baselines automatically if
#     the cache is ever cold.

on:
  schedule:
    # 03:17 UTC - deliberately off the hour, when NVD is less contended.
    # Note: scheduled workflows only fire from the DEFAULT branch.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run_baseline:
        description: "Run the one-time full corpus baseline (~210 requests)"
        type: boolean
        default: false

# Never let two runs touch the change log at once.
concurrency:
  group: nvd-gap-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Generous because the one-time baseline's duration is still unknown: the
    # keyless probe saw ~55s per request, and we do not yet know whether that
    # was throttling (which a key fixes) or NVD simply being slow (which it
    # does not). A daily sync is minutes; this ceiling only guards the
    # baseline. Actions minutes are free on a public repository.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nvd_gap/requirements.txt

      - name: Install dependencies
        run: pip install -r nvd_gap/requirements.txt

      - name: Fail fast without an API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is not set."
            echo "Rate limits apply per apparent IP, and CI runners share"
            echo "egress IPs with many other NVD consumers, so a keyless"
            echo "scheduled run will be throttled unpredictably."
            exit 1
          fi

      # Restore and save are split on purpose. The combined actions/cache only
      # writes the cache from a post step gated on whole-job success, so a
      # failure in any later step would silently discard a baseline that had
      # taken hours - and the next scheduled run would then find no state and
      # fail too, nightly, until someone noticed.
      - name: Restore collector state
        uses: actions/cache/restore@v4
        with:
          path: nvd_gap/data/state
          key: nvd-gap-state-${{ github.run_id }}
          restore-keys: |
            nvd-gap-state-

      # The baseline is an explicit, deliberate act, never something a nightly
      # run does by itself. Auto-baselining on a cold cache would let a
      # routine 5-minute job silently turn into a multi-hour corpus crawl.
      - name: Baseline (one-time, explicit)
        if: inputs.run_baseline
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        working-directory: nvd_gap
        run: python -m collector baseline --force

      # Cache the baseline the moment it succeeds: it is by far the most
      # expensive thing this workflow does, and it must survive anything that
      # goes wrong afterwards.
      - name: Save baseline state
        if: inputs.run_baseline
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: nvd_gap/data/state
          key: nvd-gap-state-${{ github.run_id }}-baseline

      - name: Require existing state
        if: ${{ !inputs.run_baseline }}
        working-directory: nvd_gap
        run: |
          if [ ! -f data/state/current.parquet ]; then
            echo "::error::No baseline state found in the Actions cache."
            echo "Run this workflow manually with run_baseline=true once."
            exit 1
          fi
          echo "State present."

      - name: Sync changes
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        working-directory: nvd_gap
        run: python -m collector sync

      - name: Recompute rollups
        working-directory: nvd_gap
        run: python -m collector rollup

      - name: Report state
        working-directory: nvd_gap
        run: python -m collector status

      # Before the commit, which is the step most likely to fail. upsert_current
      # writes via a temp file and renames, so whatever is on disk here is a
      # consistent snapshot - either the old one or the new one.
      - name: Save collector state
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: nvd_gap/data/state
          key: nvd-gap-state-${{ github.run_id }}

      - name: Commit change log and rollups
        run: |
          git config user.name  "nvd-gap-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nvd_gap/data/changes nvd_gap/data/rollups 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new changes to commit."
            exit 0
          fi
          git commit -m "data: collector run $(date -u +%Y-%m-%dT%H:%MZ)"
          # The branch can move while a long run is in flight, which would make
          # this push non-fast-forward and throw away correct collected data.
          # The collector only ever appends new files, so a rebase cannot
          # conflict semantically - retry rather than fail.
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected - rebasing onto origin/${branch} and retrying."
            git pull --rebase --autostash origin "${branch}" || exit 1
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
